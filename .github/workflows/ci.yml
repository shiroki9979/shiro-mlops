name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Every job starts from a read-only token instead of the repository default; the two jobs
# that assume an AWS role add id-token: write themselves.
permissions:
  contents: read

env:
  # Every job that sets up Terraform pins this version; it satisfies required_version in
  # infra/terraform/main.tf and infra/terraform/bootstrap/main.tf.
  TERRAFORM_VERSION: "1.11.4"
  # Every setup-uv step installs this version. Must match the ghcr.io/astral-sh/uv image that
  # docker/Dockerfile.api, docker/Dockerfile.dagster and docker/Dockerfile.mlflow copy.
  UV_VERSION: "0.11.32"

# Actions are pinned to a commit SHA with their release as a comment, and setup-uv to an exact
# uv version (scripts/check_conventions.py action-pins).

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # blob-limits reads every commit in the PR range, not only the merge result.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@6dfebec6ddbcd197e02256fbdf54deb334fb7f06 # v2.1.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check src with mypy
        run: uv run mypy

      - name: Check Python runs through uv, Docker images and pip installs are pinned, actions and uv are pinned, tech-debt markers name an issue, comment refs resolve
        run: uv run python scripts/check_conventions.py python-uv docker-pins action-pins debt-markers comment-refs

      # Stands in for a push ruleset, which a public repository cannot have (ADR-0016).
      - name: Check no commit in the PR adds a file over the size limit or with a blocked extension
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run python scripts/check_conventions.py blob-limits --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Run unit & integration tests
        run: uv run pytest tests/ -v

      - name: Run lab workspace tests
        run: uv run --package lab pytest lab/tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/package.json

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm run lint

      - name: Run frontend tests (each package and workspace tooling)
        run: pnpm run test

      - name: Build frontend
        run: pnpm run build

      - name: Check the Forecast View bundle carries no Engineering Console paths or dependencies
        working-directory: .
        run: make frontend-bundle-check

      # The deploy job uploads this bundle, the one checked above, instead of building its own:
      # it holds the apply role, and pnpm install runs third-party code (#369).
      - name: Hand the Forecast View bundle to the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forecast-view-dist
          path: frontend/apps/forecast-view/dist
          if-no-files-found: error
          retention-days: 1

  nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@6dfebec6ddbcd197e02256fbdf54deb334fb7f06 # v2.1.2
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build image and smoke test both apps, API gateway, and upstream recreation
        run: make frontend-smoke-ci

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@6dfebec6ddbcd197e02256fbdf54deb334fb7f06 # v2.1.2
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build backend images and smoke test API data status, API readiness and MLflow health
        run: make backend-smoke-ci

  infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/package.json

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Test CloudFront Functions, check Terraform formatting and validity, and run Terraform tests
        run: make infra-check

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # doc-dates and comment-kinds diff against the PR base; doc-dates also reads commit
          # dates in the PR range.
          fetch-depth: 0

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

      - name: Check relative links and anchors offline
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --include-fragments "**/*.md"
          fail: true

      - name: Install uv
        uses: astral-sh/setup-uv@6dfebec6ddbcd197e02256fbdf54deb334fb7f06 # v2.1.2
        with:
          version: ${{ env.UV_VERSION }}

      # check_conventions.py uses only the standard library, so this job skips syncing the
      # project environment that lint-and-test installs.
      - name: Check documentation terminology
        run: uv run --no-project python scripts/check_conventions.py terms

      - name: Check Markdown metadata
        run: uv run --no-project python scripts/check_conventions.py doc-metadata

      - name: Check last-updated dates of changed docs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --no-project python scripts/check_conventions.py doc-dates --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Check kinds of changed comments
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --no-project python scripts/check_conventions.py comment-kinds --base "$BASE_SHA" --head "$HEAD_SHA"

  terraform-plan:
    # Release PRs only: shows reviewers what merging into main will change in the cloud.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_TERRAFORM_PLAN_ROLE_ARN: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check whether AWS is configured
        id: aws
        run: scripts/check_aws_configured.sh AWS_TERRAFORM_PLAN_ROLE_ARN "Terraform plan"

      - name: Assume the Terraform plan role
        if: steps.aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The wrapper echoes stdout into the log and step outputs; it is off so `terraform show
      # -json` (which holds sensitive values in plain text) goes only to the file on disk.
      - name: Set up Terraform
        if: steps.aws.outputs.configured == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # --lock=false: the plan role has no write access, so it cannot create the state lockfile.
      - name: Plan the main configuration, check it deletes, replaces or forgets nothing, and write the job summary
        if: steps.aws.outputs.configured == 'true'
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: scripts/plan_terraform.sh --lock=false --summary "$GITHUB_STEP_SUMMARY" "bucket=$TF_STATE_BUCKET"

  # Applies the main Terraform configuration, then uploads the Forecast View the frontend job built
  # and smoke-checks it (docs/reference/terraform-state-and-deployment.md, "CD 部署 (main)"). It
  # sets up no Node.js, pnpm or uv and installs no packages: every step could request the OIDC
  # token or read the exported AWS_* (tests/unit/test_workflow_permissions.py). Not offline-tested;
  # the first release's ops acceptance verifies it. A failed step fails the run; nothing rolls back.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Every pre-existing job, so no failing release reaches the cloud. Not terraform-plan: it runs on
    # pull requests only, and needing a skipped job would skip this one.
    needs: [lint-and-test, frontend, nginx, backend, infra, docs]
    runs-on: ubuntu-latest
    # Serialises deploys so two runs never write the state or site/ at once. A deploy in progress is
    # never cancelled; GitHub keeps one pending run per group, so a newer push replaces a queued one.
    concurrency:
      group: deploy-forecast-view
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_TERRAFORM_APPLY_ROLE_ARN: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check whether AWS is configured
        id: aws
        run: scripts/check_aws_configured.sh AWS_TERRAFORM_APPLY_ROLE_ARN "Terraform apply 與預報檢視部署"

      # The wrapper echoes stdout into the log and step outputs; it is off so `terraform show
      # -json` (which holds sensitive values in plain text) goes only to the file on disk, and
      # `terraform output -raw` prints the bare value.
      - name: Set up Terraform
        if: steps.aws.outputs.configured == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Download the Forecast View bundle the frontend job built and checked
        if: steps.aws.outputs.configured == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: forecast-view-dist
          path: frontend/apps/forecast-view/dist

      - name: Assume the Terraform apply role
        if: steps.aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Takes the state lock. Exit 1 on any delete, replacement or forget stops the job before
      # apply; those changes are applied by hand (docs/reference/terraform-state-and-deployment.md).
      - name: Plan the main configuration and check it deletes, replaces or forgets nothing
        if: steps.aws.outputs.configured == 'true'
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: scripts/plan_terraform.sh --summary "$GITHUB_STEP_SUMMARY" "bucket=$TF_STATE_BUCKET"

      # Applies the saved plan that passed the check, not a fresh plan.
      - name: Apply the checked plan
        if: steps.aws.outputs.configured == 'true'
        working-directory: infra/terraform
        run: terraform apply -input=false tfplan

      # Read now: the site deploy role assumed below cannot read the state.
      - name: Read Terraform outputs
        if: steps.aws.outputs.configured == 'true'
        id: outputs
        working-directory: infra/terraform
        run: |
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "forecast_view_url=$(terraform output -raw forecast_view_url)" >> "$GITHUB_OUTPUT"

      - name: Assume the site deploy role
        if: steps.aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_SITE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload the Forecast View to site/
        if: steps.aws.outputs.configured == 'true'
        env:
          S3_BUCKET_NAME: ${{ steps.outputs.outputs.s3_bucket_name }}
        run: scripts/upload_forecast_view_site.sh frontend/apps/forecast-view/dist "$S3_BUCKET_NAME"

      # Not `make cloud-smoke`, which reports every failure as exit 2.
      - name: Smoke-check the deployed Forecast View
        if: steps.aws.outputs.configured == 'true'
        env:
          FORECAST_VIEW_URL: ${{ steps.outputs.outputs.forecast_view_url }}
        run: scripts/smoke_cloudfront.sh --base-url "$FORECAST_VIEW_URL"
