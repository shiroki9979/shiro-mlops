name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check Python runs through uv, tech-debt markers name an issue, comment refs resolve
        run: uv run python scripts/check_conventions.py python-uv debt-markers comment-refs

      - name: Run unit & integration tests
        run: uv run pytest tests/ -v

      - name: Run lab workspace tests
        run: uv run --package lab pytest lab/tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm run lint

      - name: Run frontend tests (each package and workspace tooling)
        run: pnpm run test

      - name: Build frontend
        run: pnpm run build

      - name: Check the Forecast View bundle carries no Engineering Console paths or dependencies
        working-directory: .
        run: make frontend-bundle-check

  nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Build image and smoke test both apps, API gateway, and upstream recreation
        run: make frontend-smoke-ci

  infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json

      # Pinned version satisfies required_version in infra/terraform/main.tf and
      # infra/terraform/bootstrap/main.tf.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Test CloudFront Functions, check Terraform formatting and validity, and run Terraform tests
        run: make infra-check

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # doc-dates and comment-kinds diff against the PR base; doc-dates also reads commit
          # dates in the PR range.
          fetch-depth: 0

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

      - name: Check relative links and anchors offline
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments "**/*.md"
          fail: true

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      # check_conventions.py uses only the standard library, so this job skips syncing the
      # project environment that lint-and-test installs.
      - name: Check documentation terminology
        run: uv run --no-project python scripts/check_conventions.py terms

      - name: Check last-updated dates of changed docs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --no-project python scripts/check_conventions.py doc-dates --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Check kinds of changed comments
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --no-project python scripts/check_conventions.py comment-kinds --base "$BASE_SHA" --head "$HEAD_SHA"

  terraform-plan:
    # Release PRs only: shows reviewers what merging into main will change in the cloud.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_TERRAFORM_PLAN_ROLE_ARN: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
    steps:
      # Until the plan role exists (ops acceptance), skip without failing so release PRs stay
      # green; setting the repository variable enables the job.
      - name: Check whether AWS is configured
        id: aws
        run: |
          if [ -z "$AWS_TERRAFORM_PLAN_ROLE_ARN" ]; then
            echo "::notice::AWS 尚未設定，略過 Terraform plan"
            echo "AWS 尚未設定（repository variable \`AWS_TERRAFORM_PLAN_ROLE_ARN\` 未設定），略過 Terraform plan。" >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.aws.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Assume the Terraform plan role
        if: steps.aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The wrapper echoes stdout into the log and step outputs; it is off so `terraform show
      # -json` (which holds sensitive values in plain text) goes only to the file on disk.
      - name: Set up Terraform
        if: steps.aws.outputs.configured == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Install uv
        if: steps.aws.outputs.configured == 'true'
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Initialise the main configuration against the remote state
        if: steps.aws.outputs.configured == 'true'
        working-directory: infra/terraform
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      # -lock=false: the plan role has no write access, so it cannot create the state lockfile.
      - name: Plan the main configuration
        if: steps.aws.outputs.configured == 'true'
        working-directory: infra/terraform
        env:
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: terraform plan -input=false -lock=false -out=tfplan

      # The plan file and its JSON hold the budget alert email in plain text: they stay on the
      # runner and are never uploaded as artifacts.
      - name: Export the saved plan as JSON
        if: steps.aws.outputs.configured == 'true'
        working-directory: infra/terraform
        run: terraform show -json tfplan > tfplan.json

      - name: Check the plan deletes, replaces or forgets nothing, and write the job summary
        if: steps.aws.outputs.configured == 'true'
        run: uv run --no-project python scripts/check_plan_safety.py infra/terraform/tfplan.json >> "$GITHUB_STEP_SUMMARY"

  # Applies the main Terraform configuration, then uploads the Forecast View and smoke-checks it
  # (docs/reference/terraform-state-and-deployment.md, "CD 部署 (main)"). Not offline-tested;
  # the first release's ops acceptance verifies it. A failed step fails the run; nothing rolls back.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Every pre-existing job, so no failing release reaches the cloud. Not terraform-plan: it runs on
    # pull requests only, and needing a skipped job would skip this one.
    needs: [lint-and-test, frontend, nginx, infra, docs]
    runs-on: ubuntu-latest
    # Serialises deploys so two runs never write the state or site/ at once. A deploy in progress is
    # never cancelled; GitHub keeps one pending run per group, so a newer push replaces a queued one.
    concurrency:
      group: deploy-forecast-view
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_TERRAFORM_APPLY_ROLE_ARN: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
    steps:
      # Until ops acceptance sets the variable, AWS is not provisioned: skip with a notice so main
      # stays green, and start deploying as soon as it is set.
      - name: Check that AWS deployment is configured
        id: aws
        run: |
          if [ -z "$AWS_TERRAFORM_APPLY_ROLE_ARN" ]; then
            echo "::notice::AWS 尚未設定，略過部署"
            echo "AWS 尚未設定（repository variable \`AWS_TERRAFORM_APPLY_ROLE_ARN\` 未設定），略過 Terraform apply 與預報檢視部署。" >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.aws.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Install uv
        if: steps.aws.outputs.configured == 'true'
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      # The wrapper echoes stdout into the log and step outputs; it is off so `terraform show
      # -json` (which holds sensitive values in plain text) goes only to the file on disk, and
      # `terraform output -raw` prints the bare value.
      - name: Set up Terraform
        if: steps.aws.outputs.configured == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Assume the Terraform apply role
        if: steps.aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialise the main Terraform configuration with the S3 state backend
        if: steps.aws.outputs.configured == 'true'
        working-directory: infra/terraform
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Plan the main Terraform configuration
        if: steps.aws.outputs.configured == 'true'
        working-directory: infra/terraform
        env:
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: terraform plan -input=false -out=tfplan

      # The plan file and its JSON hold the budget alert email in plain text: they stay on the
      # runner and are never uploaded as artifacts.
      - name: Export the saved plan as JSON
        if: steps.aws.outputs.configured == 'true'
        working-directory: infra/terraform
        run: terraform show -json tfplan > tfplan.json

      # Exit 1 on any delete, replacement or forget stops the job before apply; those changes are
      # applied by hand (docs/reference/terraform-state-and-deployment.md).
      - name: Check the plan has no deletes, replacements or forgets
        if: steps.aws.outputs.configured == 'true'
        run: uv run --no-project python scripts/check_plan_safety.py infra/terraform/tfplan.json >> "$GITHUB_STEP_SUMMARY"

      # Applies the saved plan that passed the check, not a fresh plan.
      - name: Apply the checked plan
        if: steps.aws.outputs.configured == 'true'
        working-directory: infra/terraform
        run: terraform apply -input=false tfplan

      # Read now: the site deploy role assumed below cannot read the state.
      - name: Read Terraform outputs
        if: steps.aws.outputs.configured == 'true'
        id: outputs
        working-directory: infra/terraform
        run: |
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "forecast_view_url=$(terraform output -raw forecast_view_url)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.aws.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json

      - name: Enable pinned pnpm
        if: steps.aws.outputs.configured == 'true'
        working-directory: frontend
        run: corepack enable

      - name: Install frontend dependencies
        if: steps.aws.outputs.configured == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build the Forecast View
        if: steps.aws.outputs.configured == 'true'
        working-directory: frontend
        run: pnpm --filter @shiro-mlops/forecast-view run build

      - name: Assume the site deploy role
        if: steps.aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SITE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload the Forecast View to site/
        if: steps.aws.outputs.configured == 'true'
        env:
          S3_BUCKET_NAME: ${{ steps.outputs.outputs.s3_bucket_name }}
        run: scripts/upload_forecast_view_site.sh frontend/apps/forecast-view/dist "$S3_BUCKET_NAME"

      # Run directly rather than through `make cloud-smoke`, which reports every failure as exit 2.
      - name: Smoke-check the deployed Forecast View
        if: steps.aws.outputs.configured == 'true'
        env:
          FORECAST_VIEW_URL: ${{ steps.outputs.outputs.forecast_view_url }}
        run: uv run --no-project python scripts/smoke_cloudfront.py --base-url "$FORECAST_VIEW_URL"
