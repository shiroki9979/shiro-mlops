name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check Python runs through uv and tech-debt markers name an issue
        run: uv run python scripts/check_conventions.py python-uv debt-markers

      - name: Run unit & integration tests
        run: uv run pytest tests/ -v

      - name: Run lab workspace tests
        run: uv run --package lab pytest lab/tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm run lint

      - name: Run frontend tests (each package and workspace tooling)
        run: pnpm run test

      - name: Build frontend
        run: pnpm run build

      - name: Check the Forecast View bundle carries no Engineering Console paths or dependencies
        run: pnpm run check:bundle

  nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Build image and smoke test both apps, API gateway, and upstream recreation
        run: make frontend-smoke-ci

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # doc-dates diffs against the PR base and reads commit dates in the PR range.
          fetch-depth: 0

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

      - name: Check relative links and anchors offline
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments "**/*.md"
          fail: true

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      # check_conventions.py uses only the standard library, so this job skips syncing the
      # project environment that lint-and-test installs.
      - name: Check documentation terminology
        run: uv run --no-project python scripts/check_conventions.py terms

      - name: Check last-updated dates of changed docs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --no-project python scripts/check_conventions.py doc-dates --base "$BASE_SHA" --head "$HEAD_SHA"
