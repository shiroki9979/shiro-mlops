name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run unit & integration tests
        run: |
          uv run pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm run lint

      - name: Run frontend tests
        run: pnpm run test

      - name: Build frontend
        run: pnpm run build

  nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Build local frontend image
        run: docker build -t shiro-frontend-smoke frontend

      - name: Check Nginx configuration without API
        run: docker run --rm shiro-frontend-smoke nginx -t

      - name: Smoke test built SPA and API gateway
        run: |
          set -euo pipefail
          docker network create shiro-nginx-ci
          trap 'docker rm -f shiro-nginx-ci shiro-api-ci shiro-api-ci-next >/dev/null 2>&1 || true; docker network rm shiro-nginx-ci >/dev/null 2>&1 || true' EXIT

          start_stub_api() {
            docker run -d --name "$1" --network shiro-nginx-ci --network-alias api \
              -v "$PWD/scripts/stub_api.py:/stub_api.py:ro" \
              python:3.11-alpine python /stub_api.py
          }

          wait_for_gateway() {
            for _ in {1..30}; do
              if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then
                return 0
              fi
              sleep 1
            done
            echo "Gateway /api/health did not respond within 30 seconds" >&2
            docker logs shiro-nginx-ci >&2 || true
            docker logs shiro-api-ci-next >&2 || docker logs shiro-api-ci >&2 || true
            return 1
          }

          start_stub_api shiro-api-ci
          docker run -d --name shiro-nginx-ci --network shiro-nginx-ci \
            -p 127.0.0.1:8080:80 shiro-frontend-smoke

          wait_for_gateway
          make frontend-smoke ARGS='--expected-upstream-path /health'

          # The replacement starts before the original is removed so it cannot reuse the same IP;
          # the gateway then only recovers if Nginx re-resolves `api` instead of caching its first IP.
          start_stub_api shiro-api-ci-next
          docker rm -f shiro-api-ci >/dev/null
          wait_for_gateway
