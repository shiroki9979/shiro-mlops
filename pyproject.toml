[project]
name = "shiro-mlops"
version = "0.4.0"
description = "Hybrid Local/AWS MLOps platform for dynamic horizon load forecasting with Feast, Dagster, MLflow, and LightGBM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Bo-Xue Huang (shiro)" }
]
dependencies = [
    "dagster>=1.7.0",
    "dagster-webserver>=1.7.0",
    "feast>=0.38.0",
    # WHY-NOT(mlflow): the Compose MLflow server installs this locked version, and MLflow refuses
    # to start on a database a newer release migrated; local databases are already at 3.16's schema.
    "mlflow>=3.16.0",
    "lightgbm>=4.3.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.2.0",
    "polars>=0.20.0",
    "pyarrow>=16.0.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "defusedxml>=0.7.1",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "holidays>=0.108",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "boto3-stubs[s3]>=1.44.11",
    "mypy>=2.4.1",
    # Matches the pandas minor version uv resolves; move the two together.
    "pandas-stubs~=2.3.3",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shiro_mlops"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "ERA", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Jupytext percent-format notebooks start with a YAML metadata header written as `#` comments;
# ERA001 reads lines like `#     language: python` as commented-out code.
"lab/20??-??-??-*/*.py" = ["ERA001"]

[tool.mypy]
python_version = "3.11"
files = ["src", "lab", "scripts"]
# Every lab study is a standalone script named study.py, so checking them together clashes on the
# module name; CI checks each one in its own run.
exclude = ['^lab/\d{4}-\d{2}-\d{2}-[^/]+/']
plugins = ["pydantic.mypy"]
# scikit-learn ships no type information and has no maintained stub package; stubs/sklearn
# declares only the API this repo calls, so a new sklearn import fails until it is stubbed.
# tests/unit/test_sklearn_stubs.py checks them against the installed release: signatures with
# stubtest, and the fitted attributes on a trained regressor.
mypy_path = "stubs"
strict = true

# lab/tests imports tests.helpers; tests/ is not type checked, so its errors stay hidden.
[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.uv.workspace]
members = ["lab"]

