[project]
name = "shiro-mlops"
version = "0.4.0"
description = "Hybrid Local/AWS MLOps platform for dynamic horizon load forecasting with Feast, Dagster, MLflow, and LightGBM"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Bo-Xue Huang (shiro)" }
]
dependencies = [
    "dagster>=1.7.0",
    "dagster-webserver>=1.7.0",
    "feast>=0.38.0",
    "mlflow>=2.14.0",
    "lightgbm>=4.3.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.2.0",
    "polars>=0.20.0",
    "pyarrow>=16.0.0",
    "redis>=5.0.0",
    "evidently>=0.4.0",
    "httpx>=0.27.0",
    "defusedxml>=0.7.1",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "holidays>=0.108",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shiro_mlops"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "ERA", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Jupytext percent-format notebooks start with a YAML metadata header written as `#` comments;
# ERA001 reads lines like `#     language: python` as commented-out code.
"lab/20??-??-??-*/*.py" = ["ERA001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.uv.workspace]
members = ["lab"]

