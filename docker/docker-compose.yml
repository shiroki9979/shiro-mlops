services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: shiro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shiro_timeseries
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 與應用程式共用隨套件安裝的 DDL（src/shiro_mlops/core/sql/）
      - ../src/shiro_mlops/core/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shiro_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mlflow
    container_name: shiro_mlflow
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      BACKEND_STORE_URI: postgresql://postgres:postgrespassword@postgres:5432/shiro_timeseries
      ARTIFACT_ROOT: /mlflow/artifacts

    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mlflow_artifacts:/mlflow/artifacts

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: shiro_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: local
      CWA_API_KEY: ${CWA_API_KEY:-}
      CWA_LOCATION_ALLOWLIST: ${CWA_LOCATION_ALLOWLIST:-}
      DATA_DIR: /workspace/data
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TIMESCALE_HOST: postgres
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ..:/workspace:ro

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: shiro_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # 預報檢視匯出寫入 Dagster 的 DATA_DIR/published（主機的 data/published），Nginx 以 /published/ 提供。
      # 掛載整個目錄而非單檔：匯出以 rename 原子替換檔案，單檔 bind mount 會一直指向舊檔。
      # 容器內路徑須與 frontend/nginx.conf 的 /published/ root 一致。
      - ../data/published:/usr/share/nginx/published:ro

  dagster-webserver:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dagster
    container_name: shiro_dagster_webserver
    restart: unless-stopped
    working_dir: /dagster_home
    command: dagster dev -h 0.0.0.0 -p 3000 -f /workspace/src/shiro_mlops/pipelines/definitions.py
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DAGSTER_HOME: /dagster_home
      ENVIRONMENT: local
      DATA_DIR: /workspace/data
      CWA_API_KEY: ${CWA_API_KEY:-}
      CWA_LOCATION_ALLOWLIST: ${CWA_LOCATION_ALLOWLIST:-}
      # 預報檢視匯出的 S3 上傳；bucket 留空時只寫地端目錄（ADR-0015 §2.3）。
      FORECAST_VIEW_S3_BUCKET: ${FORECAST_VIEW_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      REDIS_HOST: redis
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TIMESCALE_HOST: postgres
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ..:/workspace
      - dagster_home:/dagster_home

volumes:
  postgres_data:
  mlflow_artifacts:
  dagster_home:
