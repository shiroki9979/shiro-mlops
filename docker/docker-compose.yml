services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: shiro_postgres
    environment:
      POSTGRES_DB: shiro_timeseries
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shiro_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mlflow
    container_name: shiro_mlflow
    ports:
      - "5001:5000"
    environment:
      BACKEND_STORE_URI: postgresql://postgres:postgrespassword@postgres:5432/shiro_timeseries
      ARTIFACT_ROOT: /mlflow/artifacts

    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mlflow_artifacts:/mlflow/artifacts

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: shiro_api
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: local
      CWA_API_KEY: ${CWA_API_KEY:-}
      CWA_LOCATION_ALLOWLIST: ${CWA_LOCATION_ALLOWLIST:-}
      DATA_DIR: /workspace/data
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TIMESCALE_HOST: postgres
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ..:/workspace:ro

  dagster-webserver:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dagster
    container_name: shiro_dagster_webserver
    working_dir: /dagster_home
    command: dagster dev -h 0.0.0.0 -p 3000 -f /workspace/src/shiro_mlops/pipelines/definitions.py
    ports:
      - "3000:3000"
    environment:
      DAGSTER_HOME: /dagster_home
      ENVIRONMENT: local
      DATA_DIR: /workspace/data
      CWA_API_KEY: ${CWA_API_KEY:-}
      CWA_LOCATION_ALLOWLIST: ${CWA_LOCATION_ALLOWLIST:-}
      REDIS_HOST: redis
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TIMESCALE_HOST: postgres
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ..:/workspace
      - dagster_home:/dagster_home

volumes:
  postgres_data:
  mlflow_artifacts:
  dagster_home:
