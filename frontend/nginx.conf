server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Keeps redirects such as `/api` -> `/api/` on the host port the browser used (8080), not the container's 80.
    absolute_redirect off;

    location ^~ /api/ {
        # A variable upstream defers DNS to request time: `nginx -t` passes without an `api` host,
        # and a recreated API container's new IP is picked up without restarting Nginx.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8000;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Two apps share this origin (ADR-0014 §2.5): the Forecast View at the root and the Engineering
    # Console under /console/ (its Vite `base` in apps/engineering-console/vite.config.ts; keep in sync).
    # One origin means one `/api/` proxy above and one locale preference in localStorage for both.
    # Pre-split URLs such as /monitoring are not redirected; they fall through to the Forecast View.

    location ^~ /console/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /console/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ^~ /console/ {
        # Falls back to the console's own index.html, so deep links such as /console/data/power/load
        # load the console rather than the Forecast View.
        try_files $uri /console/index.html;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The Forecast View's exported JSON lives outside the build: Compose mounts the export's local
    # directory at /usr/share/nginx/published (keep in sync with docker/docker-compose.yml and
    # scripts/ci_nginx_smoke.sh). `=404` keeps a missing export from falling through to the SPA's
    # index.html with HTTP 200, matching CloudFront, which serves no SPA fallback under /published/.
    location ^~ /published/ {
        root /usr/share/nginx;
        try_files $uri =404;
        # Restated by scripts/smoke_nginx.py PUBLISHED_CACHE_CONTROL and by the staleTime in
        # frontend/apps/forecast-view/src/hooks/use-latest-issued-forecast.ts; keep them in sync.
        add_header Cache-Control "public, max-age=60";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
