# 全台逐時實際負載的動態視界預報（ADR-0009）。
task_id = "dynamic_horizon_forecast"
task_type = "recursive_regression"
subject = "nationwide"
target = "hourly_actual_load"

[weather]
reference_points = ["Taipei"]
fields = ["temperature", "relative_humidity"]

[policies]
# 推算序列無法回補；未滿 28 日（672 小時）不得訓練（ADR-0008）。
min_training_hours = 672
# 遞迴預報起點沒有替代來源；實際負載落後請求時間超過此時數即拒絕預報而非降級。
stale_anchor_max_lag_hours = 3
validation_fraction = 0.2

[params]
lags = [1, 2, 24, 48, 168]   # 現行模型實際使用的 lag；lag 3 從未進入訓練特徵
rolling_windows = [6, 24]

[params.model]
n_estimators = 100
learning_rate = 0.05
num_leaves = 31

[schedule]
# Asia/Taipei 時間：每日 00:00 重新訓練，每小時整點產生監控報告。
training = "0 0 * * *"
monitoring = "0 * * * *"

[health]
# 驗證期 MAPE（%）低於此值為 HEALTHY，否則 WARNING。
max_mape = 10.0
