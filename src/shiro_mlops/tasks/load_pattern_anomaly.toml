# 全台逐時實際負載的用電型態異常偵測（ADR-0009；用語見 CONTEXT.md）。
task_id = "load_pattern_anomaly"
task_type = "unsupervised_reconstruction"
subject = "nationwide"
target = "hourly_actual_load"

[weather]
# 預測時讀測站觀測而非預報，不啟用降級預報。
reference_points = ["Taipei"]
fields = ["temperature", "relative_humidity"]

[policies]
# 推算序列無法回補；未滿 28 日（672 小時）不得訓練（ADR-0008）。
min_training_hours = 672
# 評分窗以最新實際負載結束；落後請求時間超過此時數即拒絕評分。
stale_anchor_max_lag_hours = 3
validation_fraction = 0.2

[params]
window_hours = 24
# 判定門檻：驗證期校準日（與保留日逐日交錯）重建誤差的 P99。
threshold_quantile = 0.99

[params.model]
hidden_layer_sizes = [32, 8, 32]
alpha = 0.0001
learning_rate_init = 0.001
max_iter = 500

[schedule]
# Asia/Taipei 時間：每日 00:30 重新訓練（錯開動態視界預報），每小時整點產生監控報告。
training = "30 0 * * *"
monitoring = "0 * * * *"

[health]
# 三種合成異常的平均召回率不低於 min_recall，且乾淨驗證窗誤報率不高於上限時為 HEALTHY。
min_recall = 0.8
max_false_positive_rate = 0.05
